# App Info
appId = "com.currencyconverter.app"
appName = "ObminFX"
versionName = "1.0.0"
versionCode = 1
packageType = "bundle"
signing = "default"

# Build from source
[build]
    before = """
        npm install
        npm run build
        npx cap sync android
    """
    gradle = ["bundleRelease"]
    output = "app/build/outputs/bundle/release/app-release.aab"

# F-Droid metadata lives in .fdroid/metadata/
# See: .fdroid/metadata/com.currencyconverter.app.yml